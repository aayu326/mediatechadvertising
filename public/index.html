 #nav .barwrap{display:flex; align-items:center; justify-content:space-between; padding:8px 28px; max-width:1320px; margin:0 auto;}

 .logo-row img{height:66px;}

    color:var(--navy); border-radius:8px; cursor:pointer;
  }
  .navitem:hover>a, .navitem:hover>span{background:var(--bg-soft);}
  .dropdown{
    position:absolute; top:100%; left:0; background:#fff; border:1px solid var(--line); border-radius:14px;

.hero {
  position: relative;
  padding: 110px 0 90px;
  overflow: hidden;
  isolation: isolate;
  background: #ffffff;
}

/* FULL SCREEN HERO BACKGROUND VIDEO */
.hero-video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  z-index: -2;
}

/* White transparent layer */
.hero-video-overlay {
  position: absolute;
  inset: 0;

  background: rgba(255, 255, 255, 0.68);

  z-index: -1;
}

/* Content stays above video */

  position: relative;
  z-index: 2;
}

  @media(max-width:960px){ .hero-grid{grid-template-columns:1fr;} }

  .hero-visual{position:relative; height:460px;}

  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

.hero-video-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.45);
  z-index: 1;
}

.hero-visual .float-card {
  z-index: 2;
}

    position:absolute; background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px;
    box-shadow:0 24px 50px rgba(10,27,61,.14); animation:float 6s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)}}
  .blob{position:absolute; border-radius:50%; filter:blur(50px); opacity:.5;}

  /* strip */
  .strip{background:var(--navy); color:#fff; padding:22px 0; overflow:hidden; white-space:nowrap;}
  .strip-track{display:inline-flex; gap:48px; animation:marquee 22s linear infinite; font-weight:700; font-size:20px; letter-spacing:.04em;}
  .strip-track span{opacity:.85;}
  @keyframes marquee{0%{transform:translateX(0)} 100%{transform:translateX(-50%)}}

  /* grid helpers */
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:48px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}
  .grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:22px;}
  @media(max-width:900px){ .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr 1fr;} .grid-4{grid-template-columns:1fr 1fr;} }
  @media(max-width:600px){ .grid-3{grid-template-columns:1fr;} .grid-4{grid-template-columns:1fr;} }

  .section-head{max-width:640px; margin-bottom:52px;}
  .section-head h2{font-size:clamp(28px,3.4vw,44px); font-weight:800; line-height:1.12; margin:14px 0 0; letter-spacing:-.01em;}

  /* stats */
  .stat-box{text-align:center; padding:30px 10px;}
  .stat-num{font-size:44px; font-weight:800; color:var(--blue); font-family:'Manrope',sans-serif;}
  .stat-label{color:var(--muted); font-weight:600; margin-top:4px; font-size:14.5px;}

  .svc-card{
    border:1px solid var(--line); border-radius:20px; padding:30px 26px; background:#fff; cursor:pointer;
    transition:all .25s ease; display:flex; flex-direction:column; height:100%;
  }
  .svc-card:hover{border-color:var(--blue); box-shadow:0 20px 40px rgba(27,86,232,.12); transform:translateY(-4px);}
  .svc-num{font-size:13px; font-weight:800; color:var(--blue-light); letter-spacing:.05em;}
  .svc-card h3{font-size:20px; margin:12px 0 10px; font-weight:700;}

  .svc-arrow{margin-top:16px; font-weight:700; color:var(--blue); font-size:14px;}

  /* about preview */
  .img-block{border-radius:24px; overflow:hidden; aspect-ratio:4/3; background:linear-gradient(135deg,var(--navy),var(--blue));}

  /* process */
  .proc-row{display:flex; gap:26px; padding:30px 0; border-top:1px solid var(--line); align-items:flex-start;}

  .proc-row p{color:var(--muted); margin:0; max-width:640px; line-height:1.6;}

/* industry card */

.ind-card{
  position:relative;
  min-height:230px;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  padding:0;
  cursor:pointer;
  background-size:cover;
  background-position:center;
  transition:transform .3s ease, box-shadow .3s ease;
}

.ind-card::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(5,18,45,.85),
    rgba(5,18,45,.15)
  );
}

.ind-card span{
  position:relative;
  z-index:2;
  color:#fff;
  font-weight:700;
  font-size:19px;
  padding:22px;
}

.ind-card:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 40px rgba(0,0,0,.18);
}

/* Industry Images */

.ind-real-estate{
  background-image:url('IMAGES/real-estate.jpg');
}

.ind-healthcare{

}

.ind-education{

}

.ind-finance{

.ind-hospitality{

.ind-e-commerce{

  .field{margin-bottom:16px;}

  .field input, .field select, .field textarea{

  /* faq */
  .faq-item{border-bottom:1px solid var(--line);}

  .faq-plus{transition:.3s; font-size:20px; color:var(--blue);}
  .faq-item.open .faq-plus{transform:rotate(45deg);}

  /* footer */
  footer{background:var(--navy); color:#cfd8ee; padding:70px 0 30px;}

  .page-hero{padding:70px 0 60px; background:var(--bg-soft);}
  .page-hero h1{font-size:clamp(32px,4.6vw,54px); font-weight:800; margin:14px 0 16px; line-height:1.1;}

  .tag-pill{display:inline-flex; padding:6px 14px; border-radius:999px; background:var(--bg-soft); font-size:12.5px; font-weight:700; color:var(--blue); margin:4px 6px 4px 0;}
  ul.check{list-style:none; padding:0; margin:0;}
  ul.check li{padding:10px 0 10px 30px; position:relative; border-bottom:1px solid var(--line); color:var(--muted); font-size:15px;}
  ul.check li::before{content:'✓'; position:absolute; left:0; top:10px; color:var(--blue); font-weight:800;}

  .team-card{border:1px solid var(--line); border-radius:18px; overflow:hidden; background:#fff;}
  .team-photo{height:200px; background:linear-gradient(135deg,#DCE7FF,#EEF3FF); display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:800; color:var(--blue);}

  .step-track{display:flex; gap:10px; margin-bottom:36px; flex-wrap:wrap;}

  .blog-card{border:1px solid var(--line); border-radius:18px; overflow:hidden; background:#fff; transition:.25s;}

const BLOG = [
  {slug:'why-most-google-ads-accounts-underperform', title:'Why Most Google Ads Accounts Underperform (And How to Fix It)', category:'Google Ads', author:'MediaTech Editorial', date:'Aug 12, 2026', read:'6 min read',
   excerpt:'Weak account structure, poor conversion tracking and generic ad copy quietly waste more budget than most advertisers realise.',
   body:['Most underperforming Google Ads accounts share the same three problems: loose account structure, unreliable conversion tracking, and ad copy that could belong to any competitor.','Account structure matters because it determines how tightly your keywords, ads and landing pages align. Broad, disorganised ad groups dilute relevance scores and inflate cost-per-click.','Conversion tracking is the second, quieter problem. Without accurate tracking, every optimisation decision is effectively a guess. Fixing tracking before touching bids or budgets is almost always the highest-leverage first step.','Finally, ad copy that reads like every competitor`s copy fails to earn the click. Specific, differentiated messaging tied to what your business genuinely offers consistently outperforms generic templates.']},
  {slug:'meta-ads-creative-testing-framework', title:'A Simple Creative Testing Framework for Meta Ads', category:'Meta Ads', author:'MediaTech Editorial', date:'Aug 5, 2026', read:'5 min read',
   excerpt:'Meta rewards creative variety. Here is a structured way to test without letting testing become chaos.',
   body:['Meta`s delivery system performs best when it has creative variety to learn from, but unstructured testing quickly becomes expensive noise.','A useful starting framework is to test one variable at a time within a controlled budget — hook, format, or offer — rather than changing everything at once.','Give each test enough budget and time to exit the learning phase before making a decision. Judging performance too early is one of the most common testing mistakes.','Document what you learn from every test, even the ones that fail. Over time, this becomes a genuine creative playbook specific to your audience.']},
  {slug:'technical-seo-checklist', title:'A Practical Technical SEO Checklist for Growing Websites', category:'SEO', author:'MediaTech Editorial', date:'Jul 29, 2026', read:'7 min read',
   excerpt:'Before investing heavily in content, make sure the technical foundation of your site is not working against you.',
   body:['Technical SEO issues can silently undermine even excellent content. Site speed, mobile usability and crawlability should be checked before scaling content production.','Start with a crawl of your site to identify broken links, duplicate content and missing metadata — these are quick wins that often get overlooked.','Core Web Vitals affect both user experience and search visibility, making page speed optimisation a dual-purpose investment.','Finally, a clean, logical site structure with clear internal linking helps search engines understand what your most important pages are.']},

window.toggleFaq = function(id){
  const el = document.querySelector(`.faq-item[data-faq="${id}"]`);
  if(el) el.classList.toggle('open');
};

function statCounter(){
  document.querySelectorAll('.stat-num[data-count]').forEach(el=>{
    const target = parseInt(el.getAttribute('data-count'));
    const suffix = el.getAttribute('data-suffix')||'';
    let cur = 0; const step = Math.max(1, Math.round(target/40));
    const t = setInterval(()=>{ cur+=step; if(cur>=target){cur=target; clearInterval(t);} el.textContent = cur+suffix; }, 30);
  });
}

  const service = form.querySelector('[name="service"]').value;

  const message = form.querySelector('[name="message"]').value.trim();

  /*
   * IMPORTANT:
   * Yahan apna MediaTech WhatsApp number daalo.
   *
   * Example:
   * 919876543210
   *
   * +, spaces, brackets ya - mat lagana.
   */
  const whatsappNumber = "7209558552";


  const whatsappMessage = `
🔔 *NEW WEBSITE ENQUIRY*

━━━━━━━━━━━━━━━━━━

👤 *Name:* ${name}

📧 *Email:* ${email}

📱 *Phone:* ${phone || "Not provided"}

🏢 *Company:* ${company || "Not provided"}

🎯 *Service:* ${service}

💰 *Budget:* ${budget}

📝 *Message:*
${message || "Not provided"}

━━━━━━━━━━━━━━━━━━
🌐 *Source:* MediaTech Advertising Website
`;


  const whatsappURL =
    `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(whatsappMessage)}`;


  // WhatsApp open
  window.open(whatsappURL, "_blank");


  // Form reset
  form.reset();


  return false;
};

/* ============ ROUTER ============ */
function render(){
  const hash = (window.location.hash || '#/').split('?')[0];
  const path = hash.replace(/^#/, '').replace(/#.*$/,'') || '/';
  const parts = path.split('/').filter(Boolean);
  let html = '';
  if(parts.length===0) html = pageHome();
  else if(parts[0]==='about') html = pageAbout();
  else if(parts[0]==='team') html = pageTeam();
  else if(parts[0]==='services' && !parts[1]) html = pageServicesHub();
  else if(parts[0]==='services' && parts[1]) html = pageServiceDetail(parts[1]);
  else if(parts[0]==='industries' && !parts[1]) html = pageIndustriesHub();
  else if(parts[0]==='industries' && parts[1]) html = pageIndustryDetail(parts[1]);
  else if(parts[0]==='portfolio') html = pagePortfolio();
  else if(parts[0]==='case-studies' && !parts[1]) html = pageCaseStudies();
  else if(parts[0]==='case-studies' && parts[1]) html = pageCaseStudyDetail(parts[1]);
  else if(parts[0]==='blog' && !parts[1]) html = pageBlog();
  else if(parts[0]==='blog' && parts[1]) html = pageBlogDetail(parts[1]);
  else if(parts[0]==='careers' && !parts[1]) html = pageCareers();
  else if(parts[0]==='careers' && parts[1]) html = pageJobDetail(parts[1]);
  else if(parts[0]==='contact') html = pageContact();
  else if(parts[0]==='quote') html = pageQuote();
  else if(parts[0]==='privacy') html = pagePrivacy();
  else if(parts[0]==='terms') html = pageTerms();
  else html = page404();

  $('#app').innerHTML = html;
  window.scrollTo(0,0);
  statCounter();
  closeMobile();
}

renderNav();
